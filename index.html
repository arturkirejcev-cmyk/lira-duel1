<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ліра — Дуель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{
    color:#fff;
    background:
      radial-gradient(circle at 20% 0%,#37205c 0%,transparent 35%),
      radial-gradient(circle at 100% 20%,#1f3d66 0%,transparent 30%),
      #08080e;
    padding:calc(12px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom));
}
.app{max-width:560px;margin:auto}
.top{
    display:flex;justify-content:space-between;align-items:center;
    gap:10px;margin-bottom:12px
}
.brand{font-size:24px;font-weight:900}
.muted{opacity:.58;font-size:12px}
.energy{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;padding:9px 12px;font-weight:800
}
.panel{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.09);
    border-radius:22px;padding:15px;margin-bottom:12px;
    box-shadow:0 14px 40px rgba(0,0,0,.2)
}
.section-title{font-size:18px;font-weight:900;margin-bottom:10px}
.userline{
    display:flex;justify-content:space-between;gap:10px;
    background:rgba(0,0,0,.18);border-radius:14px;padding:11px
}
.cards{
    display:grid;grid-template-columns:repeat(2,1fr);gap:9px
}
.card{
    text-align:left;color:#fff;background:rgba(0,0,0,.22);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;padding:10px;cursor:pointer
}
.card.selected{border-color:#bd73ff;box-shadow:0 0 0 2px rgba(189,115,255,.18)}
.card img{
    width:100%;aspect-ratio:1/1;object-fit:cover;
    border-radius:13px;background:#15131f
}
.cardname{font-weight:900;margin-top:7px}
.rarity{font-size:12px;color:#d5a2ff;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}
.stat{background:rgba(255,255,255,.05);border-radius:8px;padding:5px;text-align:center;font-size:11px}
.stat b{display:block;font-size:13px}
.cooldown{color:#ffb0b0;font-size:11px;margin-top:5px}
button{
    width:100%;border:0;border-radius:16px;padding:14px;
    font-size:15px;font-weight:900;color:#fff;
    background:linear-gradient(135deg,#8b43ff,#c35cff);
    margin-top:9px
}
button.secondary{background:rgba(255,255,255,.08)}
button.danger{background:rgba(220,70,90,.18);border:1px solid rgba(255,100,120,.2)}
button:disabled{opacity:.4}
.arena{
    display:grid;grid-template-columns:1fr 40px 1fr;
    gap:8px;align-items:center
}
.fighter{
    background:rgba(0,0,0,.22);border-radius:18px;padding:10px;text-align:center
}
.fighter img{
    width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;background:#15131f
}
.fighter-name{font-weight:900;margin:7px 0 3px}
.hptext{font-size:12px;opacity:.75}
.hp{
    height:9px;background:rgba(255,255,255,.08);
    border-radius:99px;overflow:hidden;margin-top:7px
}
.hp i{
    display:block;height:100%;width:100%;
    background:#c96cff;transition:width .35s
}
.vs{text-align:center;font-weight:1000;opacity:.55}
.log{
    max-height:180px;overflow:auto;margin-top:10px;
    background:rgba(0,0,0,.18);border-radius:14px;padding:8px
}
.logitem{font-size:12px;padding:6px;border-bottom:1px solid rgba(255,255,255,.05)}
.result{
    text-align:center;font-size:21px;font-weight:1000;padding:10px
}
.badge{
    display:inline-block;padding:4px 8px;border-radius:9px;
    background:rgba(255,255,255,.07);font-size:11px
}
.empty{text-align:center;opacity:.55;padding:18px}
#status{text-align:center;min-height:20px;font-size:12px;opacity:.7;margin:7px 0}
.hidden{display:none!important}
</style>
</head>

<body>
<div class="app">

<div class="top">
    <div>
        <div class="brand">⚔️ Ліра — Дуель</div>
        <div class="muted">Карткова арена</div>
    </div>
    <div class="energy">⚡ <span id="energy">—</span>/100</div>
</div>

<div class="panel">
    <div class="userline">
        <div>
            <b id="username">Завантаження…</b>
            <div class="muted">XP: <span id="xp">—</span> · Рівень: <span id="level">—</span></div>
        </div>
        <div class="badge">💰 <span id="balance">0.00</span> LIR</div>
    </div>
</div>

<div id="lobby">

    <div class="panel">
        <div class="section-title">🎴 Обери картку</div>
        <div id="cards" class="cards"></div>
        <div id="cardHint" class="muted" style="margin-top:8px">Обери картку для бою.</div>
    </div>

    <div class="panel">
        <div class="section-title">⚔️ Почати дуель</div>
        <div class="muted">
            Спочатку шукаємо іншого гравця. Якщо суперника немає — автоматично буде обрано NPC-картку з уже випущених карток.
        </div>
        <button id="startBtn" onclick="startBattle()" disabled>⚔️ Знайти суперника</button>
        <button class="secondary" onclick="refreshAll()">↻ Оновити</button>
    </div>

    <div class="panel">
        <div class="section-title">📜 Історія</div>
        <div id="history" class="empty">Завантаження…</div>
    </div>

</div>

<div id="battle" class="hidden">

    <div class="panel">
        <div id="result" class="result hidden"></div>

        <div class="arena">

            <div class="fighter">
                <img id="playerImg" alt="">
                <div class="fighter-name" id="playerName">—</div>
                <div class="hptext"><span id="playerHp">—</span> HP</div>
                <div class="hp"><i id="playerBar"></i></div>
            </div>

            <div class="vs">VS</div>

            <div class="fighter">
                <img id="enemyImg" alt="">
                <div class="fighter-name" id="enemyName">—</div>
                <div class="hptext"><span id="enemyHp">—</span> HP</div>
                <div class="hp"><i id="enemyBar"></i></div>
            </div>

        </div>

        <div id="turn" class="muted" style="text-align:center;margin-top:10px">—</div>

        <button id="attackBtn" onclick="attack()">⚔️ Атакувати</button>
        <button id="surrenderBtn" class="danger" onclick="surrender()">🏳️ Здатися</button>

        <div class="log" id="battleLog"></div>

        <button class="secondary" onclick="backLobby()">◀️ До колекції</button>
    </div>

</div>

<div id="status"></div>

</div>

<script>
/*
  API працює на VPS, а цей index.html — на GitHub Pages.
  API_BASE можна передати через ?api=...; за замовчуванням використовується
  публічна HTTPS-адреса API Ліри.
*/
const DEFAULT_API_BASE = "https://91-208-184-101.sslip.io";
const API_BASE = (new URLSearchParams(window.location.search).get("api") || DEFAULT_API_BASE).replace(/\/$/, "");

const tg = window.Telegram?.WebApp;
let selectedCardId = null;
let currentMatch = null;
let cards = [];

if (tg) {
    tg.ready();
    tg.expand();
    try {
        tg.setHeaderColor("#08080e");
        tg.setBackgroundColor("#08080e");
    } catch(e) {}
}

function setStatus(text) {
    document.getElementById("status").textContent = text || "";
}

function headers() {
    return {
        "Content-Type": "application/json",
        "X-Telegram-Init-Data": tg?.initData || ""
    };
}

async function api(path, options={}) {
    const response = await fetch(API_BASE + path, {
        ...options,
        headers: {
            ...headers(),
            ...(options.headers || {})
        }
    });

    let data;
    try {
        data = await response.json();
    } catch(e) {
        throw new Error("API повернув некоректну відповідь");
    }

    if (!response.ok || data.ok === false) {
        throw new Error(data.error || ("HTTP " + response.status));
    }

    return data;
}

function imageUrl(cardId) {
    return API_BASE + "/api/card/" + encodeURIComponent(cardId) + "/image";
}

async function loadMe() {
    const data = await api("/api/me");

    const u = data.user;
    document.getElementById("username").textContent =
        u.first_name || u.username || ("ID " + u.id);

    document.getElementById("xp").textContent = u.xp;
    document.getElementById("level").textContent = u.level;
    document.getElementById("balance").textContent =
        Number(u.balance || 0).toFixed(2);

    document.getElementById("energy").textContent =
        data.energy.current;
}

function formatCooldown(value) {
    if (!value) return "";
    const d = new Date(value);
    const ms = d.getTime() - Date.now();
    if (ms <= 0) return "";

    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);

    return "⏳ " + h + " год " + m + " хв";
}

function renderCards() {
    const box = document.getElementById("cards");

    if (!cards.length) {
        box.innerHTML = '<div class="empty" style="grid-column:1/-1">У тебе ще немає карток для дуелі.</div>';
        document.getElementById("startBtn").disabled = true;
        return;
    }

    box.innerHTML = "";

    cards.forEach(card => {
        const el = document.createElement("div");
        el.className = "card" +
            (selectedCardId === card.id ? " selected" : "");

        const cooldown = formatCooldown(card.cooldown_until);

        el.innerHTML = `
            <img src="${imageUrl(card.id)}" onerror="this.style.display='none'">
            <div class="cardname">${escapeHtml(card.name)}</div>
            <div class="rarity">${escapeHtml(card.rarity)}</div>

            <div class="stats">
                <div class="stat">❤️<b>${card.hp}</b>HP</div>
                <div class="stat">⚔️<b>${card.power}</b>СИЛ</div>
                <div class="stat">🛡<b>${card.defense}</b>ЗАХ</div>
                <div class="stat">⚡<b>${card.speed}</b>ШВ</div>
                <div class="stat">💥<b>${card.crit_chance}%</b>КРИТ</div>
                <div class="stat">×<b>${card.crit_multiplier}</b>КРИТ</div>
            </div>

            ${cooldown ? `<div class="cooldown">${cooldown}</div>` : ""}
        `;

        el.onclick = () => selectCard(card.id);
        box.appendChild(el);
    });
}

function selectCard(id) {
    const card = cards.find(x => x.id === id);
    if (!card) return;

    if (card.cooldown_until && formatCooldown(card.cooldown_until)) {
        setStatus("Ця картка ще на кулдауні.");
        return;
    }

    selectedCardId = id;

    document.getElementById("cardHint").textContent =
        "Обрано: " + card.name;

    document.getElementById("startBtn").disabled = false;

    renderCards();
}

async function loadCards() {
    const data = await api("/api/cards");
    cards = data.cards || [];

    if (
        selectedCardId &&
        !cards.some(x => x.id === selectedCardId)
    ) {
        selectedCardId = null;
    }

    renderCards();
}

async function loadHistory() {
    const data = await api("/api/history");
    const box = document.getElementById("history");

    if (!data.history.length) {
        box.textContent = "Дуелей ще не було.";
        box.className = "empty";
        return;
    }

    box.className = "";

    box.innerHTML = data.history.map(item => {
        const win = item.winner_id &&
            String(item.winner_id) === String(
                tg?.initDataUnsafe?.user?.id
            );

        return `
            <div class="logitem">
                ${win ? "🏆 Перемога" : "💀 Поразка"}
                · ${item.opponent_type === "bot" ? "🤖 NPC" : "👤 Гравець"}
                · +${item.xp} XP
                ${item.reward ? "· +" + Number(item.reward).toFixed(2) + " LIR" : ""}
            </div>
        `;
    }).join("");
}

async function refreshAll() {
    try {
        setStatus("Оновлення…");
        await loadMe();
        await loadCards();
        await loadHistory();
        setStatus("");
    } catch(e) {
        setStatus("❌ " + e.message);
    }
}

async function startBattle() {
    if (!selectedCardId) {
        setStatus("Спочатку обери картку.");
        return;
    }

    const btn = document.getElementById("startBtn");
    btn.disabled = true;
    setStatus("🔎 Шукаємо іншого гравця…");

    try {
        await api("/api/match/queue", {
            method: "POST",
            body: JSON.stringify({ card_id: selectedCardId })
        });

        // Даємо PvP невелике вікно пошуку. Якщо нікого немає — NPC.
        const deadline = Date.now() + 12000;
        while (Date.now() < deadline) {
            const q = await api("/api/match/queue/status");

            if (q.status === "matched" && q.match) {
                openBattle(q.match);
                setStatus("👤 Знайдено іншого гравця!");
                await loadMe();
                return;
            }

            setStatus("🔎 Шукаємо суперника… " + Math.max(1, Math.ceil((deadline - Date.now()) / 1000)) + " с");
            await new Promise(resolve => setTimeout(resolve, 1500));
        }

        // Нікого не знайшли — запускаємо NPC-бій.
        const data = await api("/api/match/start", {
            method: "POST",
            body: JSON.stringify({ card_id: selectedCardId })
        });

        openBattle(data.match);
        setStatus("🤖 Гравця не знайдено — суперник NPC.");
        await loadMe();

    } catch(e) {
        setStatus("❌ " + e.message);
        btn.disabled = false;
    }
}

function openBattle(match) {
    currentMatch = match;
    document.getElementById("lobby").classList.add("hidden");
    document.getElementById("battle").classList.remove("hidden");
    renderMatch(match);
}

function renderMatch(m) {
    currentMatch = m;

    const p = m.player;
    const e = m.enemy;

    document.getElementById("playerName").textContent =
        p.card.name;

    document.getElementById("enemyName").textContent =
        e.card.name;

    document.getElementById("playerImg").src =
        imageUrl(p.card.id);

    document.getElementById("enemyImg").src =
        imageUrl(e.card.id);

    document.getElementById("playerHp").textContent =
        p.hp;

    document.getElementById("enemyHp").textContent =
        e.hp;

    document.getElementById("playerBar").style.width =
        Math.max(0, p.hp / p.max_hp * 100) + "%";

    document.getElementById("enemyBar").style.width =
        Math.max(0, e.hp / e.max_hp * 100) + "%";

    const turnText =
        m.finished
            ? "Бій завершено"
            : (m.turn === "player"
                ? "⚔️ Твій хід"
                : "🤖 Хід суперника");

    document.getElementById("turn").textContent =
        turnText;

    document.getElementById("attackBtn").disabled =
        m.finished || m.turn !== "player";

    document.getElementById("surrenderBtn").disabled =
        m.finished;

    const result = document.getElementById("result");

    if (m.finished) {
        result.classList.remove("hidden");

        if (m.winner === "player") {
            const r = m.result || {};
            result.textContent =
                "🏆 ПЕРЕМОГА! +" +
                (r.xp || 0) +
                " XP" +
                (r.reward ? " · +" + Number(r.reward).toFixed(2) + " LIR" : "");
        } else {
            result.textContent =
                "💀 ПОРАЗКА · картка на 24 год.";
        }
    } else {
        result.classList.add("hidden");
    }

    renderLog(m.log || []);
}

function renderLog(log) {
    const box = document.getElementById("battleLog");

    if (!log.length) {
        box.innerHTML =
            '<div class="muted">Бій ще не почався.</div>';
        return;
    }

    box.innerHTML = log.map(x => {
        const who =
            x.attacker === "player"
                ? "🔮 Твоя картка"
                : "🤖 Суперник";

        const crit =
            x.critical ? " 💥 КРИТ!" : "";

        const ability =
            x.ability_used
                ? " ✦ " + escapeHtml(x.ability_name)
                : "";

        return `
            <div class="logitem">
                ${who} → <b>${x.damage}</b> шкоди${crit}${ability}
            </div>
        `;
    }).join("");

    box.scrollTop = box.scrollHeight;
}

async function attack() {
    if (!currentMatch) return;

    document.getElementById("attackBtn").disabled = true;

    try {
        const data = await api(
            "/api/match/" +
            encodeURIComponent(currentMatch.match_id) +
            "/attack",
            {
                method: "POST",
                body: "{}"
            }
        );

        renderMatch(data.match);
        await loadMe();

        if (data.match.finished) {
            await loadCards();
            await loadHistory();
        }

    } catch(e) {
        setStatus("❌ " + e.message);
        if (currentMatch) {
            renderMatch(currentMatch);
        }
    }
}

async function surrender() {
    if (!currentMatch || currentMatch.finished) return;

    if (!confirm("Здатися? Це буде поразка.")) return;

    try {
        const data = await api(
            "/api/match/" +
            encodeURIComponent(currentMatch.match_id) +
            "/surrender",
            {
                method: "POST",
                body: "{}"
            }
        );

        renderMatch(data.match);
        await loadMe();
        await loadCards();
        await loadHistory();

    } catch(e) {
        setStatus("❌ " + e.message);
    }
}

function backLobby() {
    document.getElementById("battle").classList.add("hidden");
    document.getElementById("lobby").classList.remove("hidden");
    currentMatch = null;
    setStatus("");
    refreshAll();
}

function closeApp() {
    if (tg) tg.close();
}

function escapeHtml(s) {
    return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

async function boot() {
    if (!tg || !tg.initData) {
        setStatus(
            "⚠️ Відкрий цей сайт саме через Telegram Mini App."
        );
        return;
    }

    try {
        await api("/api/auth", {
            method: "POST",
            body: JSON.stringify({
                initData: tg.initData
            })
        });

        await refreshAll();

    } catch(e) {
        setStatus("❌ " + e.message + " | API: " + API_BASE);
    }
}

boot();
</script>
</body>
</html>
